services:
  app:
    build: .
    image: ${APP_IMAGE:-skeleton3d:local}
    restart: unless-stopped
    # Not published: only Caddy can reach it.
    expose:
      - "8000"
    volumes:
      # Processed uploads (deleted 6 h after last use), kept across restarts and deploys.
      - uploads:/data/cache

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  uploads:
  caddy_data:
  caddy_config:
