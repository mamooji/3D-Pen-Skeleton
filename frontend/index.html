<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Pen Skeleton</title>
    <script>
      // Apply the saved theme before first paint (see src/components/theme-provider.tsx).
      try {
        var t = localStorage.getItem("skeleton3d-theme") || "system";
        var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='13' ry='13' fill='none' stroke='%231f1a17' stroke-width='2.5'/%3E%3Cellipse cx='16' cy='16' rx='6' ry='13' fill='none' stroke='%2300a651' stroke-width='2.5'/%3E%3Cline x1='3' y1='16' x2='29' y2='16' stroke='%23ef4136' stroke-width='2.5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
